# Site settings
title: "Ressources pour Jeux de Rôle (JDR)"
description: "Un recueil collaboratif de liens utiles pour les joueurs et maîtres du jeu : outils, générateurs, aides de jeu et inspirations."
theme: just-the-docs
url: "https://agentcobra.github.io/jdr"

permalink: pretty

# Pages located in /ressources
defaults:
  - scope:
      path: "ressources"
      type: "pages"
    values:
      layout: "default"

exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - bin/
  - lib/
  - "*.gemspec"
  - "*.gem"
  - LICENSE.txt
  - package.json
  - package-lock.json
  - Rakefile
  - README.md
  - CODE_OF_CONDUCT.md
  - docker-compose.yml
  - Dockerfile
  - fixtures/

# Search
search_enabled: true
search:
  heading_level: 2
  previews: 2
  preview_words_before: 3
  preview_words_after: 3
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false
  focus_shortcut_key: "k"

# Code copy button
enable_copy_code_button: true

# Mermaid
mermaid:
  version: "9.1.6"

# Navigation
heading_anchors: true
nav_enabled: true
nav_sort: case_sensitive
nav_error_report: true

nav_external_links:
  - title: Just the Docs on GitHub
    url: https://github.com/just-the-docs/just-the-docs

# Aux links
aux_links:
  Template Repository: https://github.com/agentcobra/jdr
  "Just the Docs on GitHub":
    - "https://github.com/just-the-docs/just-the-docs"
aux_links_new_tab: false

# Footer
back_to_top: true
back_to_top_text: "Back to top"

footer_content: 'Copyright &copy; 2017-2020 Patrick Marsceill. Distributed by an <a href="https://github.com/just-the-docs/just-the-docs/tree/main/LICENSE.txt">MIT license.</a>'

last_edit_timestamp: true
last_edit_time_format: "%b %e %Y at %I:%M %p"

# GitHub edit links
gh_edit_link: true
gh_edit_link_text: "Edit this page on GitHub"
gh_edit_repository: "https://github.com/agentcobra/jdr"
gh_edit_branch: "dev"
gh_edit_source: ressources
gh_edit_view_mode: "tree"

# Theme
color_scheme: nil

callouts_level: quiet
callouts:
  highlight:
    color: yellow
  important:
    title: Important
    color: blue
  new:
    title: New
    color: green
  note:
    title: Note
    color: purple
  warning:
    title: Warning
    color: red

# Plugins
plugins:
  - jekyll-seo-tag
  - jekyll-github-metadata
  - jekyll-include-cache
  - jekyll-sitemap

# Markdown
kramdown:
  syntax_highlighter_opts:
    block:
      line_numbers: false

# HTML compression
compress_html:
  clippings: all
  comments: all
  endings: all
  startings: []
  blanklines: false
  profile: false

# Sass
sass:
  quiet_deps: true
  silence_deprecations: ['import']

# Liquid
liquid:
  error_mode: strict
  strict_filters: true
